name: Refresh remuneration filings

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remuneration-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check index membership
        run: npm run constituents:update
        continue-on-error: true
      - name: Check filings and retain last good records
        id: refresh
        run: node scripts/refresh-published-data.mjs
      - name: Publish snapshots
        if: ${{ !cancelled() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh published remuneration filings"
          git stash push --quiet
          git pull --rebase origin main
          git push origin HEAD:main
